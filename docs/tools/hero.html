<!doctype html>
<meta charset="utf-8">
<title>hero</title>
<style>
  :root { --bg: oklch(97% 0.006 80); --ink: oklch(20% 0.02 60); --muted: oklch(50% 0.015 60); }
  html, body { margin: 0; background: var(--bg); font-family: -apple-system, "Helvetica Neue", Inter, system-ui, sans-serif; color: var(--ink); }
  .stage { position: relative; width: 1600px; height: 900px; overflow: hidden;
    background:
      radial-gradient(1200px 600px at 20% 0%, oklch(99% 0.004 80), transparent 60%),
      linear-gradient(180deg, oklch(97.5% 0.006 80), oklch(95% 0.008 80)); }
  .grid { position: absolute; inset: 0; background-image:
      linear-gradient(oklch(90% 0.01 80 / .5) 1px, transparent 1px),
      linear-gradient(90deg, oklch(90% 0.01 80 / .5) 1px, transparent 1px);
    background-size: 40px 40px; mask-image: linear-gradient(180deg, transparent, black 30%, black 70%, transparent); }
  .shot { position: absolute; border-radius: 10px; overflow: hidden; background: #fff;
    box-shadow: 0 1px 0 oklch(0% 0 0 / .06), 0 24px 60px -20px oklch(20% 0.02 60 / .45), 0 2px 8px oklch(20% 0.02 60 / .12); }
  .shot img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .desktop { left: 72px; top: 120px; width: 1180px; height: 737px; }
  .desktop::before { content: ""; position: absolute; inset: 0; border-radius: 10px; box-shadow: inset 0 0 0 1px oklch(0% 0 0 / .08); z-index: 2; pointer-events: none; }
  .phone { left: 1230px; top: 220px; width: 300px; height: 650px; border-radius: 28px; padding: 10px; background: oklch(18% 0.01 60);
    box-shadow: 0 30px 70px -20px oklch(20% 0.02 60 / .6), 0 2px 10px oklch(20% 0.02 60 / .2); }
  .phone .screen { width: 100%; height: 100%; border-radius: 20px; overflow: hidden; background: #fff; }
  .phone .screen img { object-position: top; }
  .caption { position: absolute; left: 72px; top: 44px; display: flex; gap: 18px; align-items: baseline; }
  .caption .name { font-weight: 700; font-size: 26px; letter-spacing: -0.01em; }
  .caption .sub { font-size: 15px; color: var(--muted); }
  .tag { position: absolute; right: 72px; top: 52px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
</style>
<div class="stage">
  <div class="grid"></div>
  <div class="caption"><span class="name">{{NAME}}</span><span class="sub">{{SUB}}</span></div>
  <div class="tag">{{TAG}}</div>
  <div class="shot desktop"><img src="{{DESKTOP}}" alt=""></div>
  <div class="shot phone"><div class="screen"><img src="{{PHONE}}" alt=""></div></div>
</div>
